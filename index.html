<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EletronicMania</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">EM</div>
            <div>
                <h1>EletronicMania</h1>
                <p>Sua loja de produtos eletrônicos</p>
            </div>
        </div>
    </header>
    <main>
        <section class="secao-destaques">
            <h2>Produtos em Destaque</h2>
            <div id="destaqueCarousel" class="carousel slide">
                <div class="carousel-inner" id="destaques">
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#destaqueCarousel"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#destaqueCarousel"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>
            </div>
        </section>
        <section class="secao-catalogo">
            <h2>Todos os produtos</h2>
            <input type="text" id="busca" placeholder="Buscar produto...">
            <div id="catalogo" class="catalogo"></div>
        </section>
        <section class="secao-aluno">
            <h2>Sobre o Desenvolvedor</h2>
            <div id="informacoesAluno">
            </div>
        </section>
    </main>
    <footer>
        <p>EletronicMania - Sua loja de produtos eletrônicos</p>
    </footer>
</body>
</html>
